    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264c74" />
      <stop offset="1" stop-color="#142a45" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#183554" flood-opacity=".12" />
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#background)" />
  <circle cx="1120" cy="38" r="180" fill="#d9e9fa" opacity=".7" />

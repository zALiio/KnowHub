<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">KnowHub — learn together</title>
  <desc id="description">A knowledge-sharing community for computer science and AI students.</desc>
  <defs>

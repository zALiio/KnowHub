name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint PHP files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, iconv, pdo_mysql

      - name: Check PHP syntax
        run: find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
